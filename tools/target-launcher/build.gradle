plugins {
    id "application"
}

application {
    mainClass = "cn.li.tools.TargetGradleLauncher"
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}
tasks.withType(JavaCompile).configureEach { options.release = 17 }

// Install outside build/ so `clean` (often invoked via this same launcher)
// cannot try to delete the running Windows jar and fail with IOException.
// Intentionally not registered with clean: the launcher may still be running.
def launcherDistDir = layout.projectDirectory.dir("dist")
tasks.named("installDist", Sync).configure {
    destinationDir = launcherDistDir.asFile
}

tasks.register("testLauncher", JavaExec) {
    group = "verification"
    description = "Run dependency-free regression tests for target catalog parsing."
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "cn.li.tools.TargetGradleLauncherTest"
}

check.dependsOn testLauncher
