# Loader hook support matrix
#
# Keys are scoped by target id (forge-1.20.1 / fabric-1.20.1 / neoforge-1.21.1 / neoforge-26.2).
# For each hook kind (effect / ray / marker):
#   <target>.supported.<kind>.impl.keys  — comma-separated allowlist (empty = allow all
#                                          not listed in unsupported)
#   <target>.unsupported.<kind>.impl.keys — comma-separated denylist
#
# An impl key is supported when it is not unsupported AND (supported is empty OR key is listed).
# Keep aligned with ac/entity/hook_catalog.clj and mc*/entity/hook_registry_core.clj.
#
# Runtime classpath copy: META-INF/academy-loader-hook-support.properties
# Reader: cn.li.platform.loader-hook-support

# --- forge-1.20.1 (full hook adapters) ---
forge-1.20.1.unsupported.effect.impl.keys=
forge-1.20.1.unsupported.ray.impl.keys=
forge-1.20.1.unsupported.marker.impl.keys=
forge-1.20.1.supported.effect.impl.keys=tiered-arcs,owner-offset,generic-arc,owner-orbit,noop,vertical-ballistic
forge-1.20.1.supported.ray.impl.keys=owner-follow,noop
forge-1.20.1.supported.marker.impl.keys=owner-follow-marker,noop

# --- fabric-1.20.1 (same allowlist as historical fabric-hook-support.properties) ---
fabric-1.20.1.unsupported.effect.impl.keys=
fabric-1.20.1.unsupported.ray.impl.keys=
fabric-1.20.1.unsupported.marker.impl.keys=
fabric-1.20.1.supported.effect.impl.keys=tiered-arcs,owner-offset,generic-arc,owner-orbit,noop,vertical-ballistic
fabric-1.20.1.supported.ray.impl.keys=owner-follow,noop
fabric-1.20.1.supported.marker.impl.keys=owner-follow-marker,noop

# --- neoforge-1.21.1 (parity with forge) ---
neoforge-1.21.1.unsupported.effect.impl.keys=
neoforge-1.21.1.unsupported.ray.impl.keys=
neoforge-1.21.1.unsupported.marker.impl.keys=
neoforge-1.21.1.supported.effect.impl.keys=tiered-arcs,owner-offset,generic-arc,owner-orbit,noop,vertical-ballistic
neoforge-1.21.1.supported.ray.impl.keys=owner-follow,noop
neoforge-1.21.1.supported.marker.impl.keys=owner-follow-marker,noop

# --- neoforge-26.2 (parity with neoforge-1.21.1) ---
neoforge-26.2.unsupported.effect.impl.keys=
neoforge-26.2.unsupported.ray.impl.keys=
neoforge-26.2.unsupported.marker.impl.keys=
