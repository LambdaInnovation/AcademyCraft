mod_group=cn.li
mod_id=academy
mod_name=Academy Craft
mod_version=2.0.0
# Final artifact file base name.
mod_artifact_base_name=AcademyCraft
# Optional release suffix: alpha1, alpha2, beta1, beta2, rc1, rc2, ...
# Leave empty for a stable release; set this to alpha1/beta2/rc1 for a pre-release.
mod_release_suffix=alpha4
mod_authors=Lambda Innovation
mod_description=A mod about superability. Become an ESPer and alter your reality in Minecraft!
mod_homepage=https://ac.li-dev.cn/
mod_sources=https://github.com/LambdaInnovation/AcademyCraft
mod_issue_tracker=https://github.com/LambdaInnovation/AcademyCraft/issues
mod_license=GPLv3
mod_credits=All the players of the mod, like you
mod_logo_file=logo.png

# Clojure
clojure_version=1.13.0-alpha6
clojure_test_check_version=1.1.1
cloverage_version=1.2.4
malli_version=0.16.4
spec_alpha_version=0.6.249
core_specs_alpha_version=0.6.122-alpha8

# Gradle performance defaults for local development and CI.
# Keep workers conservative: Clojure AOT + Loom can be memory-heavy on Windows.
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=4
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m

# Configure-on-demand: only configure projects whose tasks will run.
# org.gradle.configureondemand=true
# Configuration cache is intentionally opt-in until Clojurephant/Loom/buildSrc
# compatibility is verified task-by-task.
# org.gradle.configuration-cache=true

# Toolchain auto-detection roots for the 26.2 (JDK 25) target — the api
# module compiles with JDK 21, the platform with 25.
org.gradle.java.installations.paths=C:/Program Files/Java/jdk-21.0.2,C:/Program Files/Java/jdk-25.0.2
