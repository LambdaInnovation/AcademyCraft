tasks.register("verifyBuildProfiles") {
    group = "verification"
    description = "Validate Gradle wrapper/profile isolation rules."
    doLast {
        def catalog = rootProject.ext.platformCatalog()
        def wrapperText = file("gradle/wrapper/gradle-wrapper.properties").text
        def rootVersion = (wrapperText =~ /gradle-([0-9.]+)-bin\.zip/).find() ?
            ((wrapperText =~ /gradle-([0-9.]+)-bin\.zip/)[0][1]) : null
        def problems = []
        def clojurephantVersions = new LinkedHashSet()
        def shadowByToolchain = [:].withDefault { new LinkedHashSet() }
        (catalog.buildProfiles ?: [:]).each { profileId, profile ->
            def toolchain = profile.toolchain?.toString()
            if (!toolchain || !(toolchain in ["loom", "mdg"])) {
                problems << "${profileId}: must declare toolchain as loom or mdg"
            }
            if (toolchain == "loom" && !profile.loomVersion) {
                problems << "${profileId}: loom toolchain must declare loomVersion"
            }
            if (toolchain == "mdg" && !profile.modDevGradleVersion) {
                problems << "${profileId}: mdg toolchain must declare modDevGradleVersion"
            }
            if (!profile.platformPluginId || !profile.platformPluginVersion) {
                problems << "${profileId}: must declare platformPluginId and platformPluginVersion"
            }
            if ((profile.shadowPluginId && !profile.shadowVersion) || (!profile.shadowPluginId && profile.shadowVersion)) {
                problems << "${profileId}: shadowPluginId and shadowVersion must be declared together"
            }
            if (!profile.clojurephantVersion) {
                problems << "${profileId}: must declare clojurephantVersion"
            }
            if (profile.wrapper == "root" && profile.gradleVersion.toString() != rootVersion) {
                problems << "${profileId}: declared Gradle ${profile.gradleVersion} but root wrapper is ${rootVersion}"
            }
            if (profile.wrapper != "root") {
                def wrapperPath = profile.wrapper.toString()
                if (!file(wrapperPath).exists() && !file("${wrapperPath}.bat").exists()) {
                    problems << "${profileId}: missing isolated wrapper ${wrapperPath} (or ${wrapperPath}.bat)"
                }
            }
            if (profile.clojurephantVersion) {
                clojurephantVersions << profile.clojurephantVersion.toString()
            }
            if (profile.shadowPluginId && profile.shadowVersion) {
                shadowByToolchain[profile.shadowPluginId.toString()] << profile.shadowVersion.toString()
            }
        }
        if (clojurephantVersions.size() > 1) {
            problems << "clojurephantVersion must be identical across all profiles; found ${clojurephantVersions}"
        }
        shadowByToolchain.each { shadowPluginId, versions ->
            if (versions.size() > 1) {
                problems << "shadow plugin ${shadowPluginId} must use one version; found ${versions}"
            }
        }
        def rootBuildText = file("build.gradle").text
        if (rootBuildText =~ /id\s+[\"']dev\.architectury\.loom[\"']\s+version\s+/) {
            problems << "build.gradle must not hardcode Architectury Loom version; resolve it from platform-catalog buildProfiles via settings.gradle pluginManagement"
        }
        if (rootBuildText =~ /id\s+[\"']net\.neoforged\.moddev[\"']\s+version\s+/) {
            problems << "build.gradle must not hardcode ModDevGradle version; resolve it from platform-catalog buildProfiles via settings.gradle pluginManagement"
        }
        if (rootBuildText =~ /id\s+[\"']dev\.clojurephant\.clojure[\"']\s+version\s+/) {
            problems << "build.gradle must not hardcode clojurephant version; resolve it from platform-catalog buildProfiles via settings.gradle pluginManagement"
        }
        if (rootBuildText =~ /id\s+[\"']com\.github\.johnrengelman\.shadow[\"']\s+version\s+/) {
            problems << "build.gradle must not hardcode johnrengelman shadow version; resolve it from platform-catalog buildProfiles via settings.gradle pluginManagement"
        }
        if (rootBuildText =~ /id\s+[\"']com\.gradleup\.shadow[\"']\s+version\s+/) {
            problems << "build.gradle must not hardcode gradleup shadow version; resolve it from platform-catalog buildProfiles via settings.gradle pluginManagement"
        }
        if (!problems.isEmpty()) throw new GradleException("Invalid build profiles:\n" + problems.join("\n"))
    }
}

tasks.register("verifyTargetBuildEntrypoints") {
    group = "verification"
    description = "Verify all supported OS target-build frontends share the launcher contract."
    doLast {
        def scripts = ["scripts/target-gradle.ps1", "scripts/target-gradle.cmd", "scripts/target-gradle.sh"]
        def problems = []
        scripts.each { path ->
            def script = file(path)
            if (!script.isFile()) {
                problems << "missing target build entrypoint ${path}"
            } else {
                def text = script.text
                if (!text.contains("target-launcher")) problems << "${path} does not invoke target-launcher"
                if (text.contains("--stacktrace")) problems << "${path} must not append --stacktrace"
            }
        }
        if (!problems.isEmpty()) throw new GradleException("Invalid target build entrypoints:\n" + problems.join("\n"))
    }
}

tasks.register("verifySingleApiBoundary") {
    group = "verification"
    description = "Verify the repository exposes one API project and platform builds consume its output."
    doLast {
        def settingsText = file("settings.gradle").text
        if ((settingsText =~ /include\s+[\"']api[\"']/).count != 1) {
            throw new GradleException("settings.gradle must include exactly one api project")
        }
        def buildLogicText = file("build-logic/platform-target.gradle").text
        if (buildLogicText.contains("api/src/main/java")) {
            throw new GradleException("platform build must not inject api source files")
        }
        if (!buildLogicText.contains('project(":api")')) {
            throw new GradleException("platform build must consume the :api project artifact")
        }
    }
}

// ============================================================================
// clj-kondo native static lint ??packaging gate via compileClojure
// ============================================================================

def cljKondoVersion = "2025.10.15"
def kondoDir = layout.buildDirectory.dir("clj-kondo-bin").get().asFile
def kondoExt = OperatingSystem.current().isWindows() ? ".exe" : ""
def kondoExe = new File(kondoDir, "clj-kondo${kondoExt}")

tasks.register("downloadCljKondo") {
    group = "verification"
    description = "Install/download the clj-kondo native binary for this OS (standalone)."
    outputs.file(kondoExe)
    doLast {
        if (kondoExe.exists()) {
            return
        }
        kondoDir.mkdirs()
        def os = OperatingSystem.current()
        def archiveExt = ".zip"
        def arch = System.getProperty("os.arch").toLowerCase()
        def arm = arch.contains("aarch64") || arch.contains("arm64")
        def platform =
            os.windows ? "windows-amd64"
            : os.macOsX ? (arm ? "macos-aarch64" : "macos-amd64")
            : (arm ? "linux-aarch64" : "linux-amd64")
        if (!os.windows && !os.macOsX) {
            archiveExt = ".tar.gz"
        }
        def url = "https://github.com/clj-kondo/clj-kondo/releases/download/v${cljKondoVersion}/clj-kondo-${cljKondoVersion}-${platform}${archiveExt}"
        logger.lifecycle("[clj-kondo] downloading {}", url)
        def archiveFile = new File(kondoDir, "download${archiveExt}")
        new URI(url).toURL().withInputStream { input ->
            archiveFile.withOutputStream { output -> output << input }
        }
        if (archiveExt == ".zip") {
            copy { from zipTree(archiveFile); into kondoDir }
        } else {
            copy { from tarTree(resources.gzip(archiveFile)); into kondoDir }
        }
        archiveFile.delete()
        if (!OperatingSystem.current().isWindows()) {
            kondoExe.setExecutable(true)
        }
        logger.lifecycle("[clj-kondo] ready: {}", kondoExe)
    }
}

tasks.register("lintClojureNative") {
    group = "verification"
    description = "Run clj-kondo and fail the build on lint errors."
    dependsOn tasks.named("downloadCljKondo")
    dependsOn tasks.named("verifyNeutralClojureNoMinecraftApis")
    def lintLog = layout.buildDirectory.file("reports/clj-kondo-lint.log")
    outputs.file(lintLog)
    // Declare the linted source roots as inputs; without them the task is
    // UP-TO-DATE as soon as the report exists and silently skips real errors
    // after the first run. Resolved lazily so per-target source wiring is
    // visible at up-to-date-check time.
    inputs.files {
        def dirs = []
        subprojects { sp ->
            sp.plugins.withId("dev.clojurephant.clojure") {
                sp.sourceSets.main.clojure.srcDirs.each { File dir ->
                    if (dir.directory) {
                        dirs << dir.absolutePath
                    }
                }
            }
        }
        dirs
    }
    inputs.file(file(".clj-kondo/config.edn"))
    doLast {
        def dirs = []
        subprojects { sp ->
            sp.plugins.withId("dev.clojurephant.clojure") {
                sp.sourceSets.main.clojure.srcDirs.each { File dir ->
                    if (dir.directory) {
                        dirs << dir.absolutePath
                    }
                }
            }
        }
        if (dirs.isEmpty()) {
            logger.lifecycle("[clj-kondo] no Clojure source directories")
            return
        }
        def configFile = file(".clj-kondo/config.edn")
        def kondoArgs = ["--lint"]
        kondoArgs.addAll(dirs)
        if (configFile.isFile()) {
            kondoArgs.addAll(["--config", configFile.absolutePath])
        }
        kondoArgs.addAll(["--fail-level", "error"])
        def out = new ByteArrayOutputStream()
        def err = new ByteArrayOutputStream()
        def pb = new ProcessBuilder([kondoExe.absolutePath] + kondoArgs)
        pb.directory(rootProject.projectDir)
        pb.redirectErrorStream(true)
        def proc = pb.start()
        proc.inputStream.withStream { input -> out << input }
        def exitValue = proc.waitFor()
        def result = [exitValue: exitValue]
        def log = out.toString("UTF-8")
        def logFile = lintLog.get().asFile
        logFile.parentFile.mkdirs()
        logFile.text = log
        if (result.exitValue != 0) {
            logger.error("[clj-kondo] failed; see {}", logFile)
            throw new GradleException("clj-kondo check failed (exit ${result.exitValue}); details: ${logFile}")
        }
        logger.lifecycle("[clj-kondo] passed ({} source roots)", dirs.size())
    }
}

gradle.projectsEvaluated {
    subprojects { sp ->
        sp.plugins.withId("dev.clojurephant.clojure") {
            sp.tasks.matching { it.name == "compileClojure" }.configureEach {
                dependsOn rootProject.tasks.named("lintClojureNative")
            }
        }
    }
}
